apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: service-a-vs
  namespace: mesh-demo
spec:
  hosts:
  - "*"
  gateways:
  - mesh-gateway

  http:

  # 🔥 RULE 1 — MUST BE FIRST
  - match:
    - uri:
        prefix: "/v2"
    route:
    - destination:
        host: service-a
        subset: v2

  # 🔥 RULE 2 — DEFAULT
  - route:
    - destination:
        host: service-a
        subset: v1
      weight: 80
    - destination:
        host: service-a
        subset: v2
      weight: 20