# ─────────────────────────────────────────────────────────────
# VirtualService — service-a (FIXED)
# ─────────────────────────────────────────────────────────────
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: service-a-vs
  namespace: mesh-demo
spec:
  hosts:
  - "*"   # 🔥 IMPORTANT FIX
  gateways:
  - mesh-gateway
  http:

  # /v2 → always v2
  - name: "v2-path-route"
    match:
    - uri:
        prefix: "/v2"
    route:
    - destination:
        host: service-a
        subset: v2
      weight: 100

  # /api → weighted routing
  - name: "api-route"
    match:
    - uri:
        prefix: "/api"
    route:
    - destination:
        host: service-a
        subset: v1
      weight: 80
    - destination:
        host: service-a
        subset: v2
      weight: 20

  # fallback (optional)
  - name: "default"
    route:
    - destination:
        host: service-a
        subset: v1

---
# ─────────────────────────────────────────────────────────────
# VirtualService — service-b (NO CHANGE NEEDED)
# ─────────────────────────────────────────────────────────────
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: service-b-vs
  namespace: mesh-demo
spec:
  hosts:
  - service-b
  gateways:
  - mesh
  http:
  - name: "service-b-default"
    route:
    - destination:
        host: service-b
        subset: v1
      weight: 100