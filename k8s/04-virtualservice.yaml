apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: service-a-vs
  namespace: mesh-demo
spec:
  hosts:
  - "*"
  gateways:
  - mesh-gateway
  http:

  # RULE 1: /v2 → rewrite to /api and route to v2 subset only
  - match:
    - uri:
        prefix: "/v2"
    rewrite:
      uri: "/api"
    route:
    - destination:
        host: service-a
        subset: v2
      weight: 100

  # RULE 2: default weighted canary (80% v1 / 20% v2)
  - route:
    - destination:
        host: service-a
        subset: v1
      weight: 80
    - destination:
        host: service-a
        subset: v2
      weight: 20