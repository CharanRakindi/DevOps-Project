# ══════════════════════════════════════════════════════════════════════════════
# PeerAuthentication — Strict mTLS
#
# Enforces mutual TLS for ALL traffic inside the mesh-demo namespace.
#
# STRICT mode:
#   - All inbound connections MUST use mTLS
#   - Plain-text connections are rejected with a connection error
#   - All pods in this namespace must have Istio sidecars injected
#
# PERMISSIVE mode (use during migration):
#   - Accepts both mTLS and plain-text connections
#   - Safe to use when incrementally onboarding services to the mesh
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: mesh-demo
spec:
  mtls:
    mode: STRICT
